<div class="setup-container">
  <div class="setup-card">
    <div class="logo-section">
      <div class="logo-icon">
        <span>S</span>
      </div>
      <h2>Set up your space</h2>
      <p>Create a new household or join an existing one</p>
    </div>

    <div class="options">
      <a routerLink="/create-household" class="option-card">
        <div class="option-icon">+</div>
        <h3>Create Household</h3>
        <p>Start fresh and invite your roommates</p>
      </a>

      <a routerLink="/join-household" class="option-card">
        <div class="option-icon">→</div>
        <h3>Join Household</h3>
        <p>Got an invite code? Enter it here</p>
      </a>
    </div>
  </div>
</div>
